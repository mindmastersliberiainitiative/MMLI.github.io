<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate Verification — MMLI</title>
<meta name="description" content="Verify the authenticity of a Mind Masters Liberia Initiative certificate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#00457D;--navy-deep:#00203E;--navy-mid:#0A5C9C;
    --gold:#F0B82C;--gold-deep:#D89A0E;--green:#77B14C;
    --cream:#FAF7EC;--ink:#151E2E;--muted:#69728A;--line:#E7E0C9;
    --ok:#1E7A46;--ok-bg:#E9F6EE;--bad:#B3261E;--bad-bg:#FBEAE8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);font-family:'Inter',Arial,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;}

  .bg-orb{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;opacity:.3}
  .bg-orb.o1{width:480px;height:480px;background:radial-gradient(circle,#FBDD8F,transparent 70%);top:-160px;right:-140px;animation:drift 22s ease-in-out infinite}
  .bg-orb.o2{width:420px;height:420px;background:radial-gradient(circle,var(--navy-mid),transparent 70%);bottom:-180px;left:-160px;opacity:.16;animation:drift 26s ease-in-out infinite reverse}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,26px) scale(1.06)}}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  @keyframes drawCheck{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
  @keyframes ringPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 40px;border-bottom:1px solid var(--line);
    position:relative;z-index:2;animation:fadeIn .5s ease both;}
  .topbar-brand{display:flex;align-items:center;gap:12px}
  .topbar a.home-link{font:600 13px 'Inter';color:var(--navy);text-decoration:none;
    padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;transition:border-color .2s, background .2s;}
  .topbar a.home-link:hover{border-color:var(--gold);background:#FFF9E9}
  .brand-mark{width:38px;height:38px;border-radius:10px;object-fit:contain;
    filter:drop-shadow(0 3px 8px rgba(0,69,125,.25));animation:floatSlow 5s ease-in-out infinite}
  .brand-name{font:800 13.5px 'Inter'}
  .brand-name span{display:block;font:italic 500 10.5px 'Fraunces';color:var(--gold-deep);margin-top:1px}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1;}
  .box{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:42px 36px;text-align:center;box-shadow:0 22px 50px -26px rgba(0,69,125,.32);
    animation:fadeUp .6s ease both .1s;}
  .box h1{font:600 25px 'Fraunces';color:var(--navy);margin:0 0 6px;}
  .box .lede{font:400 13.5px 'Inter';color:var(--muted);margin:0 0 24px}

  form{margin-top:6px;display:flex;gap:8px;}
  input{flex:1;padding:12px 14px;border:1.5px solid #E1E5EC;border-radius:10px;font:500 14px 'Inter';
    transition:border-color .2s, box-shadow .2s;}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(240,184,44,.18)}
  button{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;border:0;border-radius:10px;
    padding:12px 20px;font:700 13px 'Inter';cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease;box-shadow:0 10px 22px -10px rgba(0,69,125,.55)}
  button:hover{transform:translateY(-1px);box-shadow:0 14px 26px -10px rgba(0,69,125,.65)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none}

  #result{min-height:4px}
  .status{
    display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:999px;
    font:700 15px 'Inter';margin:22px 0 6px;animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;
  }
  .status.ok{background:var(--ok-bg);color:var(--ok)}
  .status.bad{background:var(--bad-bg);color:var(--bad);animation:popIn .35s ease both, shake .5s ease .35s}
  .status svg{flex:none}
  .checkring{animation:ringPop .3s ease both}
  .checkmark{stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .5s ease .15s forwards}

  .details{text-align:left;margin-top:16px;border-top:1px solid var(--line);padding-top:18px;
    animation:fadeUp .4s ease both .15s;}
  .row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .row:last-child{border-bottom:none}
  .row span:first-child{color:var(--muted);font-weight:600}
  .row span:last-child{font-weight:700;text-align:right;color:var(--ink)}
  .idbox{margin-top:18px;font:600 12.5px 'Inter';color:var(--muted);word-break:break-all;
    background:#F5F3E9;border:1px solid var(--line);padding:8px 12px;border-radius:8px;}
  .empty{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.6}

  .spinner-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px 0 4px;
    color:var(--muted);font:600 13px 'Inter';animation:fadeIn .2s ease both}
  .spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid #E1E5EC;border-top-color:var(--navy);
    animation:spin .7s linear infinite}

  .seal{
    width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:var(--navy-deep);font:800 11px 'Inter';
    box-shadow:0 10px 24px -8px rgba(216,154,14,.6);animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }

  footer{padding:20px;text-align:center;font:400 12px 'Inter';color:var(--muted);position:relative;z-index:1;}
</style>
</head>

    <div class="brand-name">Mind Masters Liberia Initiative
      <span>Certificate Verification</span>
    </div>
  </div>
  <a class="home-link" href="index.html">← MMLI Home</a>

<main>
  <div class="box" id="box">
    <div class="seal">MMLI</div>
    <h1>Verify a certificate</h1>
    <p class="lede">Enter a certificate ID or scan its QR code to confirm authenticity.</p>
    <form id="searchForm">
      <input id="idInput" placeholder="e.g. MMLI-2026-4F91A2C8" autocomplete="off">
      <button type="submit" id="checkBtn">Check</button>
    </form>
    <div id="result"></div>
  </div>
</main>
<footer>© <span id="yr"></span> Mind Masters Liberia Initiative — verification runs against the published certificate registry.</footer>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

async function loadRegistry(){
  try{
    const res = await fetch('registry.json', {cache:'no-store'});
    if (!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const checkIcon = `<svg class="checkring" width="22" height="22" viewBox="0 0 22 22">
  <circle cx="11" cy="11" r="10" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
  <path class="checkmark" d="M6 11.3 9.5 15 16.5 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
const crossIcon = `<svg width="20" height="20" viewBox="0 0 20 20">
  <circle cx="10" cy="10" r="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
  <path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
</svg>`;

function render(entry, id){
  const result = document.getElementById('result');
  if (entry){
    result.innerHTML = `
      <div class="status ok">${checkIcon} Certificate verified</div>
      <div class="details">
        <div class="row"><span>Recipient</span><span>${escapeHtml(entry.name)}</span></div>
        <div class="row"><span>Certificate of</span><span>${escapeHtml(entry.certificate_type)}</span></div>
        ${entry.achievement_area ? `<div class="row"><span>Achievement area</span><span>${escapeHtml(entry.achievement_area)}</span></div>` : ''}
        <div class="row"><span>Program</span><span>${escapeHtml(entry.program)}</span></div>
        ${entry.award ? `<div class="row"><span>Award</span><span>${escapeHtml(entry.award)}</span></div>` : ''}
        <div class="row"><span>Date issued</span><span>${escapeHtml(entry.date)}</span></div>
      </div>
      <div class="idbox">${escapeHtml(id)}</div>
    `;
  } else {
    result.innerHTML = `
      <div class="status bad">${crossIcon} Not found</div>
      <p class="empty">This ID does not match any certificate on record. Check for typos, or contact MMLI if you believe this is an error.</p>
      <div class="idbox">${escapeHtml(id)}</div>
    `;
  }
}

function renderLoading(){
  document.getElementById('result').innerHTML =
    `<div class="spinner-wrap"><span class="spinner"></span> Checking registry…</div>`;
}

async function checkId(id){
  if (!id) return;
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  renderLoading();
  const start = Date.now();
  const registry = await loadRegistry();
  const entry = registry.find(e => e.certificate_id === id);
  const elapsed = Date.now() - start;
  const wait = Math.max(0, 380 - elapsed); // small perceived-work delay for a smoother feel
  setTimeout(()=>{
    render(entry, id);
    btn.disabled = false;
  }, wait);
}

document.getElementById('searchForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  checkId(document.getElementById('idInput').value.trim());
});

const params = new URLSearchParams(location.search);
const preId = params.get('id');
if (preId){
  document.getElementById('idInput').value = preId;
  checkId(preId);
}
</script>
